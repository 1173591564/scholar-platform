[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-studio"
version = "0.2.7"
description = "AI Academic Research Engine --论文解析、知识图谱、RAG 检索、学术写作全流程"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.23",
    "mcp>=1.0,<2",
    "rapidfuzz>=3.0",
    "bibtexparser>=1.4",
    "pyparsing>=3.1,<4",
    "networkx>=3.0",
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark>=4.0"]

[project.scripts]
scholar = "scholar.cli:main"

[tool.setuptools.packages.find]
include = ["scholar*", "scholar_mcp*"]

[tool.setuptools.package-data]
scholar = ["*.json", "*.txt", "templates/**/*", "schemas/*.json", "v2/*.sql"]
